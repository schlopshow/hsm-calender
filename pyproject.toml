[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hacksmarter-calendar"
version = "1.0.0"
description = "HackSmarter Calendar - Interactive calendar and weekly schedule generator with multiple themes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "HackSmarter", email = "ctf@hacksmarter.com"}
]
keywords = ["calendar", "schedule", "planner", "hacksmarter", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "pdf2image>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/hacksmarter/calendar"
Repository = "https://github.com/hacksmarter/calendar"
Documentation = "https://github.com/hacksmarter/calendar#readme"
Issues = "https://github.com/hacksmarter/calendar/issues"

[project.scripts]
hacksmarter-calendar = "hacksmarter_calendar.cli:main"

[tool.setuptools]
packages = ["hacksmarter_calendar"]

[tool.setuptools.package-data]
hacksmarter_calendar = ["templates/*.html", "static/*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
