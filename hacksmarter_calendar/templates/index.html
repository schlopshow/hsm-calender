<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <title>HackSmarter Calendar Editor</title>
    <style>
        :root {
            --accent-color: #00ff88;
            --page-background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            --surface-color: #1a1a1a;
            --cell-color: #1a1a1a;
            --input-color: #0a0a0a;
            --border-color: #333;
            --text-color: #ffffff;
            --muted-color: #888;
            --event-background: rgba(0, 255, 136, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-background);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 3px solid var(--accent-color);
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 15px;
        }
        
        h1 {
            font-size: 3em;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--accent-color);
            margin-bottom: 10px;
        }
        
        .tagline {
            color: var(--muted-color);
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--surface-color);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .month-selector, .theme-selector {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        button {
            background: var(--accent-color);
            color: var(--input-color);
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #00cc6e;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
        }
        
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #444;
        }
        
        select, input[type="text"], input[type="time"], textarea {
            background: var(--input-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
        }
        
        select {
            cursor: pointer;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .day-header {
            background: var(--surface-color);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: var(--accent-color);
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        
        .day-cell {
            background: var(--cell-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            min-height: 120px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .day-cell:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
        }
        
        .day-cell.empty {
            background: var(--input-color);
            cursor: default;
        }
        
        .day-cell.empty:hover {
            transform: none;
            border-color: #333;
        }
        
        .day-number {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-color);
        }
        
        .weekend .day-number {
            color: var(--accent-color);
        }
        
        .event {
            background: var(--event-background);
            border-left: 3px solid var(--accent-color);
            padding: 5px 8px;
            margin: 5px 0;
            font-size: 12px;
            border-radius: 3px;
            position: relative;
        }
        
        .event:hover {
            background: rgba(0, 255, 136, 0.3);
        }
        
        .event-time {
            font-weight: bold;
            color: var(--accent-color);
        }
        
        .event-delete {
            position: absolute;
            right: 5px;
            top: 5px;
            color: #ff4444;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
        
        .event:hover .event-delete {
            display: block;
        }

        .day-details-panel {
            display: none;
            position: relative;
            z-index: 10;
            margin: 0 0 18px;
            padding: 20px;
            background: var(--surface-color);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        .day-details-panel.active {
            display: block;
        }

        .day-details-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            color: var(--accent-color);
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .day-event {
            background: var(--event-background);
            border-left: 3px solid var(--accent-color);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .day-event-title {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.05em;
        }

        .day-event-time {
            color: var(--text-color);
            font-weight: bold;
            margin-right: 8px;
        }

        .day-event-description {
            color: var(--muted-color);
            margin-top: 6px;
            white-space: pre-wrap;
        }

        .empty-day {
            color: var(--muted-color);
            padding: 12px 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface-color);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--accent-color);
            max-width: 500px;
            width: 90%;
        }
        
        .modal-header {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .generate-section {
            text-align: center;
            padding: 30px;
            background: var(--surface-color);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        
        .generate-btn {
            font-size: 20px;
            padding: 15px 40px;
            background: var(--accent-color);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="HackSmarter">HACKSMARTER CALENDAR</h1>
            <p class="tagline">// hack smarter not harder</p>
        </header>
        
        <div class="controls">
            <div class="month-selector">
                <button onclick="prevMonth()" class="btn-secondary">← Prev</button>
                <select id="monthSelect" onchange="changeMonth()">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <select id="yearSelect" onchange="changeMonth()">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
                <button onclick="nextMonth()" class="btn-secondary">Next →</button>
            </div>
            <div class="theme-selector">
                <label for="themeSelect" style="color: #888; margin-right: 10px;">Theme:</label>
                <select id="themeSelect" onchange="changeTheme()" style="min-width: 200px;">
                    <option value="hacker_green">Hacker Green</option>
                    <option value="cyberpunk_purple">Cyberpunk Purple</option>
                    <option value="electric_blue">Electric Blue</option>
                    <option value="hot_pink">Hot Pink</option>
                    <option value="matrix_green">Matrix Green</option>
                    <option value="orange_fire">Orange Fire</option>
                    <option value="neon_yellow">Neon Yellow</option>
                    <option value="red_alert">Red Alert</option>
                    <option value="crimson_red">Crimson Red</option>
                    <option value="white_minimal">White Minimal</option>
                </select>
            </div>
            <button onclick="clearAllEvents()" class="btn-secondary">Clear All Events</button>
        </div>
        
        <div class="day-details-panel" id="dayDetailsPanel">
            <div class="day-details-panel-header">
                <span id="dayDetailsHeader">Day details</span>
                <button type="button" class="btn-secondary" onclick="closeDayDetails()">Close</button>
            </div>
            <div id="dayDetails"></div>
        </div>

        <div class="calendar-grid" id="calendar">
            <!-- Calendar will be generated here -->
        </div>
        
        <div class="generate-section">
            <h2 style="color: #00ff88; margin-bottom: 20px;">📥 DOWNLOAD OPTIONS</h2>
            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                <div style="text-align: center;">
                    <button onclick="generateMonthlyPNG(this)" class="generate-btn">MONTHLY CALENDAR</button>
                    <p style="color: #888; margin-top: 10px; font-size: 14px;">Full month view with all events</p>
                </div>
                <div style="text-align: center;">
                    <button onclick="generateWeeklyPNG(this)" class="generate-btn" style="background: linear-gradient(135deg, #ff00ff 0%, #cc00cc 100%);">WEEKLY SCHEDULE</button>
                    <p style="color: #888; margin-top: 10px; font-size: 14px;">Detailed week view (current week)</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Add Event</div>
            <div class="form-group">
                <label>Event Title *</label>
                <input type="text" id="eventTitle" placeholder="Meeting, Birthday, etc.">
            </div>
            <div class="form-group">
                <label>Time (optional)</label>
                <input type="time" id="eventTime">
            </div>
            <div class="form-group">
                <label>Description (optional)</label>
                <textarea id="eventDescription" placeholder="Additional details..."></textarea>
            </div>
            <div class="modal-buttons">
                <button onclick="closeModal()" class="btn-secondary">Cancel</button>
                <button onclick="saveEvent()">Save Event</button>
            </div>
        </div>

    </div>
    
    <script>
        let currentMonth = new Date().getMonth() + 1;
        let currentYear = new Date().getFullYear();
        let currentEvents = {};
        let selectedDate = null;

        const themes = {
            hacker_green: {
                accent: '#00ff88', page: 'linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%)',
                surface: '#1a1a1a', cell: '#1a1a1a', input: '#0a0a0a',
                border: '#333333', text: '#ffffff', muted: '#888888'
            },
            cyberpunk_purple: {
                accent: '#ff00ff', page: 'linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 100%)',
                surface: '#1a0a1a', cell: '#1a0a1a', input: '#0a0a0a',
                border: '#4a1a4a', text: '#ffffff', muted: '#bb88bb'
            },
            electric_blue: {
                accent: '#00d4ff', page: 'linear-gradient(135deg, #0a0a0a 0%, #0a1a2a 100%)',
                surface: '#0a1a2a', cell: '#0a1a2a', input: '#0a0a0a',
                border: '#1a4a6a', text: '#ffffff', muted: '#88bbcc'
            },
            hot_pink: {
                accent: '#ff0066', page: 'linear-gradient(135deg, #0a0a0a 0%, #2a0a1a 100%)',
                surface: '#1a0a0f', cell: '#1a0a0f', input: '#0a0a0a',
                border: '#4a1a2a', text: '#ffffff', muted: '#cc88aa'
            },
            matrix_green: {
                accent: '#00ff00', page: 'linear-gradient(135deg, #000000 0%, #001100 100%)',
                surface: '#001100', cell: '#001100', input: '#000000',
                border: '#003300', text: '#00ff00', muted: '#66aa66'
            },
            orange_fire: {
                accent: '#ff6600', page: 'linear-gradient(135deg, #0a0a0a 0%, #2a1a0a 100%)',
                surface: '#1a0f0a', cell: '#1a0f0a', input: '#0a0a0a',
                border: '#4a3a1a', text: '#ffffff', muted: '#cc9966'
            },
            neon_yellow: {
                accent: '#ffff00', page: 'linear-gradient(135deg, #0a0a0a 0%, #2a2a0a 100%)',
                surface: '#1a1a0a', cell: '#1a1a0a', input: '#0a0a0a',
                border: '#4a4a1a', text: '#ffffff', muted: '#cccc66'
            },
            red_alert: {
                accent: '#ff0000', page: 'linear-gradient(135deg, #0a0a0a 0%, #2a0a0a 100%)',
                surface: '#1a0a0a', cell: '#1a0a0a', input: '#0a0a0a',
                border: '#4a1a1a', text: '#ffffff', muted: '#cc8888'
            },
            crimson_red: {
                accent: '#dc143c', page: 'linear-gradient(135deg, #0a0000 0%, #1a0505 100%)',
                surface: '#150505', cell: '#150505', input: '#0a0000',
                border: '#4a0a0a', text: '#ffffff', muted: '#cc8888'
            },
            white_minimal: {
                accent: '#000000', page: 'linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%)',
                surface: '#f5f5f5', cell: '#fafafa', input: '#ffffff',
                border: '#cccccc', text: '#000000', muted: '#666666'
            }
        };

        function changeTheme() {
            const theme = themes[document.getElementById('themeSelect').value] || themes.hacker_green;
            const root = document.documentElement;
            root.style.setProperty('--accent-color', theme.accent);
            root.style.setProperty('--page-background', theme.page);
            root.style.setProperty('--surface-color', theme.surface);
            root.style.setProperty('--cell-color', theme.cell);
            root.style.setProperty('--input-color', theme.input);
            root.style.setProperty('--border-color', theme.border);
            root.style.setProperty('--text-color', theme.text);
            root.style.setProperty('--muted-color', theme.muted);
            root.style.setProperty('--event-background', `${theme.accent}33`);
        }
        
        const monthNames = ['', 'January', 'February', 'March', 'April', 'May', 'June',
                           'July', 'August', 'September', 'October', 'November', 'December'];
        
        // Security: Sanitize HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Validate date format YYYY-MM-DD
        function validateDate(dateStr) {
            const pattern = /^\d{4}-\d{2}-\d{2}$/;
            if (!pattern.test(dateStr)) return false;
            const date = new Date(dateStr);
            return date instanceof Date && !isNaN(date);
        }
        
        // Validate time format HH:MM
        function validateTime(timeStr) {
            if (!timeStr) return true;
            const pattern = /^\d{2}:\d{2}$/;
            if (!pattern.test(timeStr)) return false;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours >= 0 && hours <= 23 && minutes >= 0 && minutes <= 59;
        }
        
        // Validate year and month
        function validateMonthYear(month, year) {
            return month >= 1 && month <= 12 && year >= 1900 && year <= 2100;
        }
        
        function initCalendar() {
            document.getElementById('monthSelect').value = currentMonth;
            document.getElementById('yearSelect').value = currentYear;
            loadCalendar();
        }
        
        async function loadCalendar() {
            if (!validateMonthYear(currentMonth, currentYear)) {
                console.error('Invalid month or year');
                return;
            }
            
            try {
                const response = await fetch(`/api/calendar/${currentYear}/${currentMonth}`);
                if (!response.ok) {
                    throw new Error('Failed to load calendar');
                }
                const data = await response.json();
                currentEvents = data.events || {};
                renderCalendar(data);
            } catch (error) {
                console.error('Error loading calendar:', error);
                alert('Failed to load calendar. Please try again.');
            }
        }
        
        function renderCalendar(data) {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            closeDayDetails();
            
            // Day headers
            const days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
            days.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                calendar.appendChild(header);
            });
            
            // Calendar days
            data.weeks.forEach(week => {
                week.forEach((day, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'day-cell';
                    
                    if (day === 0) {
                        cell.classList.add('empty');
                    } else {
                        cell.dataset.date = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        if (index >= 5) cell.classList.add('weekend');
                        
                        const dayNum = document.createElement('div');
                        dayNum.className = 'day-number';
                        dayNum.textContent = day;
                        cell.appendChild(dayNum);
                        
                        const dateKey = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        
                        // Add events
                        if (currentEvents[dateKey]) {
                            currentEvents[dateKey].forEach((event, eventIndex) => {
                                const eventDiv = document.createElement('div');
                                eventDiv.className = 'event';
                                
                                // Sanitize event data
                                const safeTitle = escapeHtml(event.title || '');
                                const safeTime = event.time ? escapeHtml(event.time) : '';
                                
                                eventDiv.innerHTML = `
                                    ${safeTime ? `<span class="event-time">${safeTime}</span> ` : ''}
                                    ${safeTitle}
                                `;
                                const deleteButton = document.createElement('span');
                                deleteButton.className = 'event-delete';
                                deleteButton.textContent = '✕';
                                deleteButton.addEventListener('click', (eventClick) => {
                                    eventClick.stopPropagation();
                                    deleteEvent(dateKey, eventIndex);
                                });
                                eventDiv.appendChild(deleteButton);
                                cell.appendChild(eventDiv);
                            });
                        }
                        cell.addEventListener('click', (eventClick) => {
                            if (eventClick.target.closest('.event-delete')) return;
                            openDayDetails(dateKey, day);
                        });


                    }
                    
                    calendar.appendChild(cell);
                });
            });
        }

        
        function openModal(dateKey, day) {
            selectedDate = dateKey;
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventModal').classList.add('active');
            document.getElementById('eventModal').querySelector('.modal-header').textContent = 
                `Add Event - ${monthNames[currentMonth]} ${day}, ${currentYear}`;
        }

        function openDayDetails(dateKey, day) {
            const details = document.getElementById('dayDetails');
            document.getElementById('dayDetailsHeader').textContent =
                `${monthNames[currentMonth]} ${day}, ${currentYear}`;
            const events = currentEvents[dateKey] || [];
            details.innerHTML = '';

            if (!events.length) {
                details.innerHTML = '<p class="empty-day">No events scheduled for this day.</p>';
            } else {
                events.forEach((event, eventIndex) => {
                    const eventElement = document.createElement('div');
                    eventElement.className = 'day-event';
                    const time = event.time
                        ? `<span class="day-event-time">${escapeHtml(event.time)}</span>`
                        : '';
                    const description = event.description
                        ? `<div class="day-event-description">${escapeHtml(event.description)}</div>`
                        : '';
                    eventElement.innerHTML = `
                        ${time}<span class="day-event-title">${escapeHtml(event.title || '')}</span>
                        ${description}
                    `;

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'btn-secondary';
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', async () => {
                        await deleteEvent(dateKey, eventIndex, false);
                        openDayDetails(dateKey, day);
                    });
                    eventElement.appendChild(deleteButton);
                    details.appendChild(eventElement);
                });
            }
            document.getElementById('dayDetailsPanel').classList.add('active');
        }

        function closeDayDetails() {
            document.getElementById('dayDetailsPanel').classList.remove('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }
        
        async function saveEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value.trim();
            const description = document.getElementById('eventDescription').value.trim();
            
            // Validate inputs
            if (!title) {
                alert('Please enter an event title');
                return;
            }
            
            if (title.length > 200) {
                alert('Event title is too long (max 200 characters)');
                return;
            }
            
            if (time && !validateTime(time)) {
                alert('Invalid time format. Use HH:MM');
                return;
            }
            
            if (description.length > 500) {
                alert('Description is too long (max 500 characters)');
                return;
            }
            
            if (!validateDate(selectedDate)) {
                alert('Invalid date');
                return;
            }
            
            const event = {
                date: selectedDate,
                title: title,
                time: time,
                description: description
            };
            
            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save event');
                }
                
                closeModal();
                await loadCalendar();
            } catch (error) {
                console.error('Error saving event:', error);
                alert(error.message || 'Failed to save event. Please try again.');
            }
        }
        
        async function deleteEvent(date, index, confirmDelete = true) {
            if (confirmDelete && !confirm('Delete this event?')) return false;
            
            if (!validateDate(date)) {
                alert('Invalid date');
                return;
            }
            
            try {
                const response = await fetch('/api/events', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, index })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete event');
                }
                
                await loadCalendar();
                return true;
            } catch (error) {
                console.error('Error deleting event:', error);
                alert('Failed to delete event. Please try again.');
                return false;
            }
        }
        
        async function clearAllEvents() {
            if (!confirm('Clear all events from this calendar?')) return;

            try {
                const response = await fetch('/api/events/clear', { method: 'DELETE' });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to clear events');
                }

                currentEvents = {};
                await loadCalendar();
            } catch (error) {
                console.error('Error clearing events:', error);
                alert(error.message || 'Failed to clear events. Please try again.');
            }
        }
        
        function prevMonth() {
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            initCalendar();
        }
        
        function nextMonth() {
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            initCalendar();
        }
        
        function changeMonth() {
            currentMonth = parseInt(document.getElementById('monthSelect').value);
            currentYear = parseInt(document.getElementById('yearSelect').value);
            loadCalendar();
        }
        
        async function generateMonthlyPNG(button = document.querySelector('.generate-btn')) {
            if (!validateMonthYear(currentMonth, currentYear)) {
                alert('Invalid month or year');
                return;
            }
            
            const btn = button;
            const originalText = btn.textContent;
            btn.textContent = '⏳ Generating...';
            btn.classList.add('loading');
            btn.disabled = true;
            
            try {
                const theme = document.getElementById('themeSelect').value;
                const response = await fetch(`/api/generate/${currentYear}/${currentMonth}?theme=${theme}`);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to generate PNG');
                }
                
                const blob = await response.blob();
                
                if (!['image/png', 'application/pdf'].includes(blob.type)) {
                    throw new Error('Invalid file type received');
                }
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const extension = blob.type === 'application/pdf' ? 'pdf' : 'png';
                a.download = `HackSmarter_${monthNames[currentMonth]}_${currentYear}_${theme}.${extension}`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                btn.textContent = '✓ Downloaded!';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error generating PNG:', error);
                alert(error.message || 'Error generating PNG. Please try again.');
                btn.textContent = originalText;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }
        
        async function generateWeeklyPNG(button = document.querySelectorAll('.generate-btn')[1]) {
            if (!validateMonthYear(currentMonth, currentYear)) {
                alert('Invalid month or year');
                return;
            }
            
            const btn = button;
            const originalText = btn.textContent;
            btn.textContent = '⏳ Generating...';
            btn.classList.add('loading');
            btn.disabled = true;
            
            try {
                const theme = document.getElementById('themeSelect').value;
                const monthPrefix = `${currentYear}-${String(currentMonth).padStart(2, '0')}-`;
                const firstEventDate = Object.keys(currentEvents)
                    .filter(date => date.startsWith(monthPrefix))
                    .sort()[0];
                const scheduleDay = firstEventDate
                    ? Number(firstEventDate.slice(-2))
                    : 1;
                const response = await fetch(
                    `/api/generate/weekly/${currentYear}/${currentMonth}/${scheduleDay}?theme=${theme}`
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to generate weekly schedule');
                }
                
                const blob = await response.blob();
                
                if (!['image/png', 'application/pdf'].includes(blob.type)) {
                    throw new Error('Invalid file type received');
                }
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const extension = blob.type === 'application/pdf' ? 'pdf' : 'png';
                a.download = `HackSmarter_Weekly_${monthNames[currentMonth]}_${currentYear}_${theme}.${extension}`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                btn.textContent = '✓ Downloaded!';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error generating weekly schedule:', error);
                alert(error.message || 'Error generating weekly schedule. Please try again.');
                btn.textContent = originalText;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }
        
        // Close modal when clicking outside
        document.getElementById('eventModal').addEventListener('click', (e) => {
            if (e.target.id === 'eventModal') closeModal();
        });
        
        // Initialize
        changeTheme();
        initCalendar();
    </script>
</body>
</html>
